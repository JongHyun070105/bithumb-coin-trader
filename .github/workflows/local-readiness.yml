name: Local research and dashboard checks

on:
  pull_request:
    paths:
      - "src/bithumb_coin_trader/**"
      - "tests/**"
      - "dashboard/**"
      - "pyproject.toml"
      - ".github/workflows/local-readiness.yml"
  push:
    branches:
      - codex/pre-30h-readiness-20260927
    paths:
      - "src/bithumb_coin_trader/**"
      - "tests/**"
      - "dashboard/**"
      - "pyproject.toml"
      - ".github/workflows/local-readiness.yml"

permissions:
  contents: read

concurrency:
  group: local-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check -e . pytest
      - name: Run synthetic research and PAPER regressions
        run: >-
          python -m pytest -q
          tests/test_dashboard_api.py
          tests/test_paper_public_feed.py
          tests/test_bithumb_websocket.py
          tests/test_paper_session.py
          tests/test_paper_runtime.py
          tests/test_paper_journal.py
          tests/test_paper_engine.py
          tests/test_paper.py
          tests/test_risk_engine.py
          tests/test_end_to_end_paper_pipeline.py
          tests/research_infra/test_paper_start_gate.py
          tests/research_infra/test_paper_readiness.py
          tests/research_infra/test_candidate_freeze.py
          tests/research_infra/test_reliability_seal.py
          tests/research_infra/test_definition_registry.py
          tests/research_infra/test_costs.py
          tests/test_post30h_orchestrator.py

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
